spring.application.name=rohit-sweets-backend
server.port=8080

# Comma-separated list of allowed frontend origins. Override in production via env var.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Only expose the health endpoint from Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
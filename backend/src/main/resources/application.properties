spring.application.name=rohit-sweets-backend
server.port=8080

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/rohit_sweets}

spring.datasource.username=${DB_USER:rohit_sweets}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true

# Hibernate: create nothing, validate nothing yet \u2014 we're testing Flyway ALONE first
spring.jpa.hibernate.ddl-auto=validate

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never


# JWT (no default \u2014 must be set as an environment variable, same pattern as DB_PASSWORD)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:720}

# First admin account. Only used once, on first startup, if admin_users is empty.
# Leave ADMIN_PASSWORD unset to skip creating an account.
app.admin.default-username=${ADMIN_USERNAME:admin}
app.admin.default-password=${ADMIN_PASSWORD:}
services:
  db:
    image: postgres:16
    container_name: rohit-sweets-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-rohit_sweets}
      POSTGRES_USER: ${DB_USER:-rohit_sweets}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the .env file}
    ports:
      - "127.0.0.1:5432:5432"   # reachable only from this computer
    volumes:
      - rohit_sweets_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-rohit_sweets} -d ${DB_NAME:-rohit_sweets}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rohit_sweets_pgdata:
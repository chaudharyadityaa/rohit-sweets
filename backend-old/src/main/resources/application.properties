spring.application.name=rohit-sweets-backend
server.port=8080

# Comma-separated list of allowed frontend origins. Override in production via env var.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Database (override with environment variables outside development)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/rohit_sweets}
spring.datasource.username=${DB_USER:rohit_sweets}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway owns the schema. Hibernate only checks that entities match it.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Only expose the health endpoint from Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

logging.level.org.hibernate.SQL=DEBUG
logging.level.com.zaxxer.hikari=DEBUG

debug=true